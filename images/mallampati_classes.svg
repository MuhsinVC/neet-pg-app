<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="100%">
  <rect width="600" height="280" fill="#0f172a" rx="12"/>
  <text x="300" y="26" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui">Modified Mallampati Airway Classification</text>
  
  <!-- Class I -->
  <g transform="translate(40, 50)">
    <circle cx="50" cy="80" r="45" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <!-- Faucial pillars & full uvula -->
    <path d="M 25,65 Q 50,45 75,65" fill="#e11d48"/>
    <path d="M 45,65 L 45,95 Q 50,105 55,95 L 55,65 Z" fill="#fda4af"/>
    <text x="50" y="150" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui">Class I</text>
    <text x="50" y="168" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui">Pillars + Uvula</text>
  </g>
  
  <!-- Class II -->
  <g transform="translate(170, 50)">
    <circle cx="50" cy="80" r="45" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 25,75 Q 50,55 75,75" fill="#e11d48"/>
    <path d="M 46,75 L 46,95 Q 50,100 54,95 L 54,75 Z" fill="#fda4af"/>
    <text x="50" y="150" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui">Class II</text>
    <text x="50" y="168" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui">Uvula visible</text>
  </g>
  
  <!-- Class III -->
  <g transform="translate(300, 50)">
    <circle cx="50" cy="80" r="45" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 25,85 Q 50,70 75,85" fill="#e11d48"/>
    <path d="M 47,85 L 47,93 Q 50,96 53,93 L 53,85 Z" fill="#fda4af"/>
    <text x="50" y="150" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui">Class III</text>
    <text x="50" y="168" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui">Base of uvula only</text>
  </g>
  
  <!-- Class IV -->
  <g transform="translate(430, 50)">
    <circle cx="50" cy="80" r="45" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <!-- Hard palate only -->
    <path d="M 25,95 Q 50,90 75,95" fill="#e11d48"/>
    <text x="50" y="150" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui">Class IV</text>
    <text x="50" y="168" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui">Hard palate only</text>
  </g>
  
  <!-- Bottom High-Yield Bar -->
  <rect x="40" y="225" width="520" height="40" fill="#1e293b" rx="8"/>
  <text x="300" y="250" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui">Class III &amp; IV predict difficult direct laryngoscopy &amp; intubation!</text>
</svg>