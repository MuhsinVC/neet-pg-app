<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <rect width="600" height="320" fill="#0f172a" rx="12"/>
  <text x="300" y="26" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle" font-family="system-ui">Lineweaver-Burk Double Reciprocal Plot: Enzyme Inhibition</text>
  
  <!-- Axes -->
  <line x1="280" y1="40" x2="280" y2="290" stroke="#64748b" stroke-width="2"/>
  <line x1="40" y1="210" x2="560" y2="210" stroke="#64748b" stroke-width="2"/>
  <text x="270" y="55" fill="#94a3b8" font-size="11" text-anchor="end" font-family="system-ui">1 / V (Velocity)</text>
  <text x="550" y="200" fill="#94a3b8" font-size="11" text-anchor="end" font-family="system-ui">1 / [S] (Substrate)</text>
  
  <!-- Control Line (Green) -->
  <line x1="120" y1="270" x2="480" y2="90" stroke="#22c55e" stroke-width="3"/>
  <circle cx="280" cy="190" r="5" fill="#22c55e"/>
  <circle cx="160" cy="250" r="5" fill="#22c55e"/>
  <text x="490" y="95" fill="#22c55e" font-size="11" font-weight="bold" font-family="system-ui">Uninhibited</text>
  
  <!-- Competitive Inhibition (Blue): Same Y-intercept (1/Vmax), Shifts right on X-axis -->
  <line x1="190" y1="270" x2="440" y2="50" stroke="#38bdf8" stroke-width="3"/>
  <text x="450" y="55" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui">Competitive (Same 1/Vmax, Km increases)</text>
  
  <!-- Non-Competitive Inhibition (Orange): Same X-intercept (-1/Km), Shifts up on Y-axis -->
  <line x1="120" y1="240" x2="450" y2="80" stroke="#f97316" stroke-width="3" stroke-dasharray="4,2"/>
  <text x="460" y="80" fill="#f97316" font-size="11" font-weight="bold" font-family="system-ui">Non-Competitive (Vmax decreases, Km same)</text>
  
  <text x="290" y="225" fill="#fbbf24" font-size="10" font-family="system-ui">Y-intercept = 1/Vmax</text>
  <text x="100" y="195" fill="#fbbf24" font-size="10" font-family="system-ui">X-intercept = -1/Km</text>
</svg>