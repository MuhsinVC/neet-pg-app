<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="100%">
  <rect width="600" height="280" fill="#020617" rx="12"/>
  <text x="300" y="28" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="system-ui">Capnography Waveforms (EtCO2 Real-Time Tracing)</text>
  
  <!-- Baseline -->
  <line x1="40" y1="210" x2="560" y2="210" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="225" fill="#64748b" font-size="10" font-family="system-ui">0 mmHg</text>
  <text x="40" y="85" fill="#64748b" font-size="10" font-family="system-ui">40 mmHg</text>
  
  <!-- Left: Normal Waveform (Crisp rectangular) -->
  <path d="M 50,210 L 80,210 L 85,90 L 180,85 L 185,210 L 220,210" fill="none" stroke="#22c55e" stroke-width="3"/>
  <text x="135" y="65" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui">Normal Box-Shaped Waveform</text>
  
  <!-- Right: Shark-Fin Waveform (Severe Bronchospasm) -->
  <path d="M 260,210 L 290,210 Q 320,180 370,85 L 375,210 L 410,210 Q 440,180 490,85 L 495,210 L 530,210" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
  <text x="430" y="65" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui">'Shark-Fin' Pattern (Asthma / COPD)</text>
  
  <!-- Clinical Warning Box -->
  <rect x="40" y="235" width="520" height="32" fill="#1e293b" rx="6"/>
  <text x="300" y="256" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="system-ui">Cause: Sloped expiratory upstroke due to uneven, prolonged airway resistance in bronchospasm.</text>
</svg>