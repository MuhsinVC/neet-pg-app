<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="100%">
  <rect width="600" height="280" fill="#0f172a" rx="12"/>
  <text x="300" y="26" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle" font-family="system-ui">Bio-Medical Waste (BMW) Management Rules (India)</text>
  
  <!-- Yellow Bin -->
  <g transform="translate(40, 50)">
    <rect x="0" y="20" width="95" height="120" rx="10" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <text x="47" y="55" fill="#713f12" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui">YELLOW</text>
    <text x="47" y="160" fill="#fef08a" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui">Incineration</text>
    <text x="47" y="175" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="system-ui">Anatomical tissues,</text>
    <text x="47" y="188" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="system-ui">soiled dressings, blood</text>
  </g>
  
  <!-- Red Bin -->
  <g transform="translate(175, 50)">
    <rect x="0" y="20" width="95" height="120" rx="10" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <text x="47" y="55" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui">RED</text>
    <text x="47" y="160" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui">Autoclaving / Recycling</text>
    <text x="47" y="175" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="system-ui">Contaminated plastics,</text>
    <text x="47" y="188" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="system-ui">catheters, IV tubing</text>
  </g>
  
  <!-- White Translucent Box -->
  <g transform="translate(310, 50)">
    <rect x="0" y="20" width="95" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="47" y="55" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui">WHITE</text>
    <text x="47" y="160" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui">Puncture-Proof</text>
    <text x="47" y="175" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="system-ui">Sharps, needles,</text>
    <text x="47" y="188" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="system-ui">scalpel blades</text>
  </g>
  
  <!-- Blue Box -->
  <g transform="translate(445, 50)">
    <rect x="0" y="20" width="95" height="120" rx="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
    <text x="47" y="55" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui">BLUE</text>
    <text x="47" y="160" fill="#93c5fd" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui">Disinfection</text>
    <text x="47" y="175" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="system-ui">Glassware, medicine vials,</text>
    <text x="47" y="188" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="system-ui">metal implants</text>
  </g>
  
  <rect x="40" y="235" width="500" height="30" fill="#1e293b" rx="6"/>
  <text x="290" y="254" fill="#facc15" font-size="10" text-anchor="middle" font-family="system-ui">Rule: Anatomical = Yellow | Recyclable Plastics = Red | Sharps = White | Glass = Blue</text>
</svg>