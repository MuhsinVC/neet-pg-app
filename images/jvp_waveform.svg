<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" fill="#0f172a" rx="12"/>
  <text x="300" y="30" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui">Jugular Venous Pulse (JVP) Waveform</text>
  
  <!-- Baseline -->
  <line x1="50" y1="230" x2="550" y2="230" stroke="#334155" stroke-width="1.5"/>
  
  <!-- JVP Wave: a, c, x, v, y -->
  <path d="M 60,230 Q 90,230 110,130 Q 130,230 160,200 Q 180,170 200,200 Q 230,260 270,260 Q 310,260 350,150 Q 380,240 430,255 Q 480,240 540,230" fill="none" stroke="#38bdf8" stroke-width="4"/>
  
  <!-- Points and Annotations -->
  <!-- 'a' wave -->
  <circle cx="110" cy="130" r="6" fill="#ef4444"/>
  <text x="110" y="110" fill="#ef4444" font-size="16" font-weight="black" text-anchor="middle" font-family="system-ui">'a' wave</text>
  <text x="110" y="85" fill="#fca5a5" font-size="10" text-anchor="middle" font-family="system-ui">Right Atrial Contraction (End-diastole)</text>
  
  <!-- 'c' wave -->
  <circle cx="190" cy="180" r="5" fill="#fbbf24"/>
  <text x="190" y="165" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui">'c' wave</text>
  <text x="190" y="145" fill="#fef08a" font-size="9" text-anchor="middle" font-family="system-ui">Tricuspid valve bulging during RV systole</text>
  
  <!-- 'x' descent -->
  <circle cx="270" cy="260" r="5" fill="#a855f7"/>
  <text x="270" y="280" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui">'x' descent</text>
  
  <!-- 'v' wave -->
  <circle cx="350" cy="150" r="6" fill="#3b82f6"/>
  <text x="350" y="130" fill="#38bdf8" font-size="16" font-weight="black" text-anchor="middle" font-family="system-ui">'v' wave</text>
  <text x="350" y="105" fill="#93c5fd" font-size="10" text-anchor="middle" font-family="system-ui">Passive Atrial Filling (Tricuspid closed)</text>
  
  <!-- 'y' descent -->
  <circle cx="430" cy="255" r="5" fill="#10b981"/>
  <text x="430" y="280" fill="#34d47a" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui">'y' descent</text>
  <text x="430" y="295" fill="#6ee7b7" font-size="9" text-anchor="middle" font-family="system-ui">Emptying into RV upon tricuspid opening</text>
</svg>