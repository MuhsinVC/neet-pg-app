<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" fill="#0f172a" rx="12"/>
  <text x="300" y="26" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle" font-family="system-ui">Pure Tone Audiogram: Otosclerosis with Carhart's Notch</text>
  
  <!-- Frequencies (Hz) -->
  <text x="100" y="55" fill="#94a3b8" font-size="10" font-family="system-ui">250</text>
  <text x="180" y="55" fill="#94a3b8" font-size="10" font-family="system-ui">500</text>
  <text x="260" y="55" fill="#94a3b8" font-size="10" font-family="system-ui">1000</text>
  <text x="340" y="55" fill="#fbbf24" font-size="11" font-weight="bold" font-family="system-ui">2000 Hz</text>
  <text x="420" y="55" fill="#94a3b8" font-size="10" font-family="system-ui">4000</text>
  <text x="500" y="55" fill="#94a3b8" font-size="10" font-family="system-ui">8000</text>
  
  <!-- Grid -->
  <line x1="80" y1="70" x2="540" y2="70" stroke="#334155"/>
  <line x1="80" y1="120" x2="540" y2="120" stroke="#334155"/>
  <line x1="80" y1="170" x2="540" y2="170" stroke="#334155"/>
  <line x1="80" y1="220" x2="540" y2="220" stroke="#334155"/>
  
  <text x="50" y="75" fill="#64748b" font-size="10" font-family="system-ui">0 dB</text>
  <text x="50" y="125" fill="#64748b" font-size="10" font-family="system-ui">20 dB</text>
  <text x="50" y="175" fill="#64748b" font-size="10" font-family="system-ui">40 dB</text>
  <text x="50" y="225" fill="#64748b" font-size="10" font-family="system-ui">60 dB</text>
  
  <!-- Air Conduction (AC - Blue line) -->
  <path d="M 105,210 L 185,200 L 265,190 L 345,185 L 425,175 L 505,160" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="450" y="200" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui">Air Conduction (Loss)</text>
  
  <!-- Bone Conduction (BC - Red line with Carhart Notch at 2000 Hz) -->
  <path d="M 105,80 L 185,85 L 265,95 L 345,150 L 425,100 L 505,105" fill="none" stroke="#ef4444" stroke-width="3"/>
  
  <!-- Carhart Notch Marker -->
  <circle cx="345" cy="150" r="6" fill="#fbbf24"/>
  <text x="345" y="175" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui">Carhart's Notch (2 kHz dip in Bone Conduction)</text>
  
  <rect x="50" y="245" width="500" height="40" fill="#1e293b" rx="6"/>
  <text x="300" y="265" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="system-ui">Otosclerosis: Air-Bone Gap + Pathognomonic Carhart Notch at 2,000 Hz (resolves after Stapedotomy).</text>
</svg>