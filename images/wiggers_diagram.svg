<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#0f172a" rx="12"/>
  <text x="300" y="28" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui">Wiggers Cardiac Cycle Diagram (NEET PG High Yield)</text>
  
  <!-- Grid Lines -->
  <line x1="60" y1="50" x2="60" y2="300" stroke="#334155" stroke-dasharray="3,3"/>
  <line x1="150" y1="50" x2="150" y2="300" stroke="#334155" stroke-dasharray="3,3"/>
  <line x1="280" y1="50" x2="280" y2="300" stroke="#334155" stroke-dasharray="3,3"/>
  <line x1="360" y1="50" x2="360" y2="300" stroke="#334155" stroke-dasharray="3,3"/>
  <line x1="520" y1="50" x2="520" y2="300" stroke="#334155" stroke-dasharray="3,3"/>
  
  <!-- Labels for Phases -->
  <text x="105" y="45" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui">Isovolumetric Contraction</text>
  <text x="215" y="45" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui">Ventricular Ejection</text>
  <text x="320" y="45" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui">Isovolumetric Relaxation</text>
  <text x="440" y="45" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui">Ventricular Filling</text>
  
  <!-- Aortic Pressure Curve (Red) -->
  <path d="M 60,170 Q 150,170 150,170 Q 215,70 280,120 Q 290,135 300,125 Q 400,150 520,170" fill="none" stroke="#ef4444" stroke-width="3.5"/>
  <text x="290" y="95" fill="#ef4444" font-size="11" font-weight="bold" font-family="system-ui">Aortic Pressure (120 mmHg)</text>
  
  <!-- Dicrotic Notch -->
  <circle cx="295" cy="128" r="4" fill="#fbbf24"/>
  <text x="310" y="145" fill="#fbbf24" font-size="10" font-family="system-ui">Dicrotic Notch (Aortic Valve Closes)</text>
  
  <!-- Ventricular Pressure Curve (Blue) -->
  <path d="M 60,260 L 150,260 L 150,170 Q 215,65 280,120 L 360,260 L 520,260" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="215" y="60" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui">Left Ventricular Pressure</text>
  
  <!-- Valve Events -->
  <rect x="135" y="270" width="30" height="18" fill="#4f46e5" rx="4"/>
  <text x="150" y="283" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui">Mitral Closes (S1)</text>
  
  <rect x="345" y="270" width="30" height="18" fill="#e11d48" rx="4"/>
  <text x="360" y="283" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui">Mitral Opens</text>
  
  <!-- ECG Track (Green) -->
  <path d="M 60,320 L 100,320 Q 115,310 125,320 L 135,320 L 140,325 L 145,295 L 152,330 L 156,320 L 220,320 Q 240,305 260,320 L 520,320" fill="none" stroke="#4ade80" stroke-width="2"/>
  <text x="145" y="340" fill="#4ade80" font-size="10" font-family="system-ui">QRS</text>
  <text x="245" y="338" fill="#4ade80" font-size="10" font-family="system-ui">T wave</text>
</svg>