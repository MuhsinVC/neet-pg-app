<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" fill="#020617" rx="12"/>
  <text x="300" y="26" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle" font-family="system-ui">CT Head: Epidural (EDH) vs Subdural Hematoma (SDH)</text>
  
  <!-- Left: Epidural Hematoma -->
  <g transform="translate(60, 40)">
    <!-- Skull -->
    <ellipse cx="100" cy="110" rx="90" ry="105" fill="#1e293b" stroke="#f8fafc" stroke-width="4"/>
    <!-- Biconvex / Lentiform collection -->
    <path d="M 160,50 Q 110,110 160,170 Q 185,110 160,50" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
    <text x="100" y="235" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui">Epidural Hematoma (EDH)</text>
    <text x="100" y="252" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui">Biconvex / Lentiform • Arterial (MMA)</text>
    <text x="100" y="266" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui">Does NOT cross suture lines</text>
  </g>
  
  <!-- Right: Subdural Hematoma -->
  <g transform="translate(350, 40)">
    <ellipse cx="100" cy="110" rx="90" ry="105" fill="#1e293b" stroke="#f8fafc" stroke-width="4"/>
    <!-- Crescentic collection crossing sutures -->
    <path d="M 150,30 Q 185,110 150,190 Q 170,110 150,30" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
    <text x="100" y="235" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui">Subdural Hematoma (SDH)</text>
    <text x="100" y="252" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui">Crescentic • Venous (Bridging veins)</text>
    <text x="100" y="266" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui">CROSSES suture lines</text>
  </g>
</svg>